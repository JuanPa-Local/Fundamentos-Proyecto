spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/openlib_db
    username: openlib_user
    password: openlib_database
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080