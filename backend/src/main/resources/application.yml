spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/openlib_db
    username: openlib_user
    password: openlib_database
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080