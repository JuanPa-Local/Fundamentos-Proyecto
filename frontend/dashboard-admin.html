<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - OpenLib Market</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="logo">OpenLib <span>Market</span></div>
        <p style="color:var(--danger); font-size:0.8rem; margin-top:0.5rem;">Panel Administrador</p>
        <nav class="sidebar-nav">
            <a href="#" class="active" id="nav-users">Usuarios</a>
            <a href="#" id="nav-moderation">Moderación Libros</a>
            <a href="#" id="nav-orders">Todas las Órdenes</a>
            <a href="#" id="nav-reviews">Moderar Reseñas</a>
            <a href="#" id="nav-categories">Categorías</a>
            <a href="#" onclick="api.auth.logout()">Cerrar Sesión</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="flex space-between mb-1" style="align-items: center;">
            <h2 id="viewTitle">Gestión de Usuarios</h2>
            <div id="userInfo" style="color: var(--text-muted);"></div>
        </header>

        <!-- Vista Usuarios -->
        <section id="view-users" class="view-section">
            <div class="flex gap-1 mb-1">
                <button class="btn btn-outline" onclick="loadUsers('BUYER')">Buyers</button>
                <button class="btn btn-outline" onclick="loadUsers('SELLER')">Sellers</button>
                <button class="btn btn-outline" onclick="loadUsers('ADMIN')">Admins</button>
            </div>
            <div id="usersTable"></div>
        </section>

        <!-- Vista Moderación -->
        <section id="view-moderation" class="view-section" style="display: none;">
            <div class="flex gap-1 mb-1">
                <button class="btn btn-outline" onclick="loadBooksByStatus('PENDIENTE')">Pendientes</button>
                <button class="btn btn-outline" onclick="loadBooksByStatus('APROBADO')">Aprobados</button>
                <button class="btn btn-outline" onclick="loadBooksByStatus('RECHAZADO')">Rechazados</button>
            </div>
            <div id="moderationGrid" class="books-grid"></div>
        </section>

        <!-- Vista Órdenes -->
        <section id="view-orders" class="view-section" style="display: none;">
            <div id="ordersTable"></div>
        </section>

        <!-- Vista Moderación de Reseñas -->
        <section id="view-reviews" class="view-section" style="display: none;">
            <div class="flex gap-1 mb-1">
                <button class="btn btn-outline active" id="tab-all-reviews" onclick="switchReviewTab('all')">Todas las Reseñas</button>
                <button class="btn btn-outline" id="tab-reported-reviews" onclick="switchReviewTab('reported')">Reseñas Reportadas</button>
            </div>
            <div id="reviewsTable"></div>
        </section>

        <!-- Vista Categorías -->
        <section id="view-categories" class="view-section" style="display: none;">
            <div class="auth-card" style="max-width: 600px; margin-bottom: 2rem;">
                <h3>Agregar Categoría</h3>
                <div class="flex gap-1">
                    <input type="text" id="newCategoryName" placeholder="Nombre de categoría" style="flex:1;">
                    <button class="btn btn-primary" onclick="addCategory()">Agregar</button>
                </div>
            </div>
            <div id="categoriesList"></div>
            <div id="categoryBooksList" style="margin-top: 2rem;"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = api.auth.getCurrentUser();
            if (!user || user.role !== 'ADMIN') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userInfo').textContent = `Admin: ${user.fullName}`;

            const views = ['users', 'moderation', 'orders', 'reviews', 'categories'];
            views.forEach(v => {
                document.getElementById(`nav-${v}`).addEventListener('click', (e) => {
                    e.preventDefault();
                    views.forEach(view => {
                        document.getElementById(`view-${view}`).style.display = 'none';
                        document.getElementById(`nav-${view}`).classList.remove('active');
                    });
                    document.getElementById(`view-${v}`).style.display = 'block';
                    document.getElementById(`nav-${v}`).classList.add('active');

                    if (v === 'users') { document.getElementById('viewTitle').textContent = 'Gestión de Usuarios'; loadUsers('BUYER'); }
                    if (v === 'moderation') { document.getElementById('viewTitle').textContent = 'Moderación de Libros'; loadBooksByStatus('PENDIENTE'); }
                    if (v === 'orders') { document.getElementById('viewTitle').textContent = 'Todas las Órdenes'; loadAllOrders(); }
                    if (v === 'reviews') { document.getElementById('viewTitle').textContent = 'Moderar Reseñas'; switchReviewTab('all'); }
                    if (v === 'categories') { document.getElementById('viewTitle').textContent = 'Gestión de Categorías'; loadAdminCategories(); }
                });
            });

            loadUsers('BUYER');
        });

        async function loadUsers(role) {
            const container = document.getElementById('usersTable');
            try {
                container.innerHTML = '<p>Cargando...</p>';
                const users = await api.get(`/users/role/${role}`);
                if (!users || users.length === 0) { container.innerHTML = '<p>No hay usuarios con rol ' + role + '.</p>'; return; }

                let html = `<table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="border-bottom:2px solid var(--surface-light); text-align:left;">
                        <th style="padding:0.8rem;">Nombre</th>
                        <th style="padding:0.8rem;">Email</th>
                        <th style="padding:0.8rem;">Estado</th>
                        <th style="padding:0.8rem;">Acciones</th>
                    </tr></thead><tbody>`;

                users.forEach(u => {
                    const isActive = u.active !== false;
                    html += `<tr style="border-bottom:1px solid var(--surface-light);">
                        <td style="padding:0.8rem;">${u.fullName}</td>
                        <td style="padding:0.8rem; color:var(--text-muted);">${u.email}</td>
                        <td style="padding:0.8rem;">
                            <span style="color:${isActive ? 'var(--primary)' : 'var(--danger)'}; font-weight:bold;">${isActive ? 'Activo' : 'Inactivo'}</span>
                        </td>
                        <td style="padding:0.8rem;">
                            ${isActive
                                ? `<button class="btn btn-danger" style="font-size:0.8rem;" onclick="toggleUser('${u.id}', false, '${role}')">Desactivar</button>`
                                : `<button class="btn btn-primary" style="font-size:0.8rem;" onclick="toggleUser('${u.id}', true, '${role}')">Activar</button>`
                            }
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) { container.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        async function toggleUser(userId, activate, role) {
            try {
                const endpoint = activate ? `/users/${userId}/activate` : `/users/${userId}/deactivate`;
                await api.post(endpoint);
                loadUsers(role);
            } catch (e) { alert(e.message); }
        }

        async function loadBooksByStatus(status) {
            const grid = document.getElementById('moderationGrid');
            try {
                grid.innerHTML = '<p>Cargando...</p>';
                const books = await api.get(`/books/status/${status}`);
                if (!books || books.length === 0) { grid.innerHTML = `<p>No hay libros con estado ${status}.</p>`; return; }
                grid.innerHTML = '';
                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div style="background:var(--surface-light); height:160px; display:flex; align-items:center; justify-content:center;">
                            ${book.coverUrl ? `<img src="${book.coverUrl}" style="height:100%; object-fit:cover; width:100%;" onerror="this.outerHTML='<span style=font-size:3rem>📚</span>'">` : '<span style="font-size:3rem">📚</span>'}
                        </div>
                        <div class="book-info">
                            <h3 class="book-title">${book.title}</h3>
                            <p class="book-author">${book.author} — $${book.price.toFixed(2)}</p>
                            <p style="color:var(--text-muted); font-size:0.8rem;">Seller: ${book.sellerEmail || 'N/A'}</p>
                            ${status === 'PENDIENTE' ? `
                                <div class="flex gap-1 mt-1">
                                    <button class="btn btn-primary" style="flex:1; font-size:0.8rem;" onclick="approveBook('${book.id}')">Aprobar</button>
                                    <button class="btn btn-danger" style="flex:1; font-size:0.8rem;" onclick="rejectBook('${book.id}')">Rechazar</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) { grid.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        async function approveBook(bookId) {
            try { await api.post(`/books/${bookId}/approve`); loadBooksByStatus('PENDIENTE'); } catch (e) { alert(e.message); }
        }

        async function rejectBook(bookId) {
            const reason = prompt('Razón del rechazo:');
            if (!reason) return;
            try { await api.post(`/books/${bookId}/reject`, { reason }); loadBooksByStatus('PENDIENTE'); } catch (e) { alert(e.message); }
        }

        async function loadAllOrders() {
            const container = document.getElementById('ordersTable');
            try {
                container.innerHTML = '<p>Cargando...</p>';
                const orders = await api.get('/orders');
                if (!orders || orders.length === 0) { container.innerHTML = '<p>No hay órdenes registradas.</p>'; return; }

                let html = `<table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="border-bottom:2px solid var(--surface-light); text-align:left;">
                        <th style="padding:0.8rem;">ID</th>
                        <th style="padding:0.8rem;">Usuario</th>
                        <th style="padding:0.8rem;">Monto</th>
                        <th style="padding:0.8rem;">Estado</th>
                    </tr></thead><tbody>`;

                orders.forEach(o => {
                    html += `<tr style="border-bottom:1px solid var(--surface-light);">
                        <td style="padding:0.8rem; font-family:monospace; font-size:0.85rem;">${o.id.substring(0, 8)}...</td>
                        <td style="padding:0.8rem;">${o.user ? o.user.fullName : 'N/A'}</td>
                        <td style="padding:0.8rem; color:var(--primary); font-weight:bold;">$${(o.totalPrice || 0).toFixed(2)}</td>
                        <td style="padding:0.8rem;">${o.status || 'COMPLETADA'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) { container.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        function switchReviewTab(tab) {
            document.getElementById('tab-all-reviews').classList.toggle('active', tab === 'all');
            document.getElementById('tab-reported-reviews').classList.toggle('active', tab === 'reported');
            if (tab === 'all') loadAllReviews();
            else loadReportedReviews();
        }

        async function loadAllReviews() {
            const container = document.getElementById('reviewsTable');
            try {
                container.innerHTML = '<p>Cargando reseñas...</p>';
                const reviews = await api.get('/reviews').catch(() => []);
                renderReviewsTable(container, reviews, false);
            } catch (error) { container.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        async function loadReportedReviews() {
            const container = document.getElementById('reviewsTable');
            try {
                container.innerHTML = '<p>Cargando reseñas reportadas...</p>';
                const reviews = await api.get('/reviews/reported').catch(() => []);
                renderReviewsTable(container, reviews, true);
            } catch (error) { container.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        function renderReviewsTable(container, reviews, reportedOnly) {
            if (!reviews || reviews.length === 0) {
                container.innerHTML = `<p>${reportedOnly ? 'No hay reseñas reportadas en este momento.' : 'No hay reseñas registradas.'}</p>`;
                return;
            }
            let html = '<div style="display:flex; flex-direction:column; gap:1rem;">';
            reviews.forEach(r => {
                let stars = '';
                for(let i=0;i<5;i++) stars += i < r.rating ? '★' : '☆';
                const isReported = r.status === 'REPORTADA';
                html += `
                    <div style="background:var(--surface); padding:1.5rem; border-radius:8px; border:1px solid ${isReported ? 'var(--danger)' : 'var(--surface-light)'}; border-left:4px solid ${isReported ? 'var(--danger)' : 'var(--primary)'}">
                        <div class="flex space-between" style="margin-bottom: 0.5rem;">
                            <div>
                                <strong style="color:var(--text)">${r.user && r.user.fullName ? r.user.fullName : 'Usuario'}</strong>
                                <span style="color:gold; margin-left:0.5rem;">${stars}</span>
                                ${isReported ? '<span style="background:var(--danger); color:white; font-size:0.75rem; padding:0.2rem 0.5rem; border-radius:4px; margin-left:0.5rem;">REPORTADA</span>' : ''}
                            </div>
                            <span style="color:var(--text-muted); font-size:0.85rem;">${r.book && r.book.title ? r.book.title : 'Libro desconocido'}</span>
                        </div>
                        <p style="color:var(--text-muted); margin-bottom: 1rem;">${r.comment || 'Sin comentario'}</p>
                        <div class="flex gap-1">
                            ${isReported
                                ? `<button class="btn btn-outline" style="font-size:0.8rem;" onclick="reactivateReview('${r.id}')">Reactivar</button>
                                   <button class="btn btn-danger" style="font-size:0.8rem;" onclick="deleteReview('${r.id}')">Eliminar</button>`
                                : `<button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger); font-size:0.8rem;" onclick="reportReview('${r.id}')">Reportar</button>`
                            }
                        </div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function hideReview(id) {
            try { await api.post(`/reviews/${id}/hide`); switchReviewTab(document.getElementById('tab-reported-reviews').classList.contains('active') ? 'reported' : 'all'); } catch (e) { alert(e.message); }
        }

        async function reportReview(id) {
            try { await api.post(`/reviews/${id}/report`); switchReviewTab('reported'); } catch (e) { alert(e.message); }
        }

        async function reactivateReview(id) {
            try { await api.post(`/reviews/${id}/reactivate`); switchReviewTab(document.getElementById('tab-reported-reviews').classList.contains('active') ? 'reported' : 'all'); } catch (e) { alert(e.message); }
        }

        async function deleteReview(id) {
            if (!confirm('¿Eliminar esta reseña definitivamente?')) return;
            try { await api.delete(`/reviews/${id}`); switchReviewTab('reported'); } catch (e) { alert(e.message); }
        }

        async function loadAdminCategories() {
            const container = document.getElementById('categoriesList');
            try {
                container.innerHTML = '<p>Cargando...</p>';
                const categories = await api.get('/books/categories');
                if (!categories || categories.length === 0) { container.innerHTML = '<p>No hay categorías definidas.</p>'; return; }

                let html = '<div style="display:flex; flex-wrap:wrap; gap:1rem;">';
                categories.forEach(c => {
                    html += `<button class="btn btn-outline" onclick="viewCategoryBooks('${c}')">${c}</button>`;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (e) { container.innerHTML = `<p class="error-message">${e.message}</p>`; }
        }

        async function viewCategoryBooks(category) {
            const container = document.getElementById('categoryBooksList');
            try {
                container.innerHTML = `<p>Buscando libros de <strong>${category}</strong>...</p>`;
                const books = await api.get('/books');
                // El campo ahora es categories (array), buscamos si la categoría está incluida
                const filtered = books.filter(b => Array.isArray(b.categories) && b.categories.includes(category));
                
                if (filtered.length === 0) {
                    container.innerHTML = `<p>No hay libros en la categoría <strong>${category}</strong>.</p>`;
                    return;
                }
                
                let html = `<h4>Libros en ${category} (${filtered.length})</h4>
                            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">`;
                filtered.forEach(b => {
                    const cats = Array.isArray(b.categories) ? b.categories.map(c => `<span style="background:rgba(0,212,255,0.12); color:var(--primary); font-size:0.72rem; padding:0.15rem 0.5rem; border-radius:20px;">${c}</span>`).join(' ') : '';
                    html += `
                        <div style="background:var(--surface); padding:1rem; border-radius:8px; border:1px solid var(--surface-light);">
                            <strong>${b.title}</strong><br>
                            <small style="color:var(--text-muted);">${b.author}</small><br>
                            <div style="margin: 0.4rem 0;">${cats}</div>
                            <small style="color:var(--primary);">${b.status}</small>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<p class="error-message">${e.message}</p>`;
            }
        }

        async function addCategory() {
            const name = document.getElementById('newCategoryName').value;
            if (!name) return;
            try {
                await api.post('/books/categories', { name });
                alert('Categoría añadida con éxito: ' + name);
                document.getElementById('newCategoryName').value = '';
                loadAdminCategories();
            } catch (e) {
                alert('Error al añadir categoría: ' + e.message);
            }
        }
    </script>
</body>
</html>
