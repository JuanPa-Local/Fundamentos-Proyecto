<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Vendedor - OpenLib Market</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-layout">
    <aside class="sidebar">
        <div class="logo">OpenLib <span>Market</span></div>
        <p style="color:var(--primary); font-size:0.8rem; margin-top:0.5rem;">Panel Vendedor</p>
        <nav class="sidebar-nav">
            <a href="#" class="active" id="nav-mybooks">Mis Libros</a>
            <a href="#" id="nav-publish">Publicar Libro</a>
            <a href="#" id="nav-sales">Mis Ventas</a>
            <a href="#" id="nav-profile">Mi Perfil</a>
            <a href="#" onclick="api.auth.logout()">Cerrar Sesión</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="flex space-between mb-1" style="align-items: center;">
            <h2 id="viewTitle">Mis Libros</h2>
            <div id="userInfo" style="color: var(--text-muted);"></div>
        </header>

        <!-- Vista Mis Libros -->
        <section id="view-mybooks" class="view-section">
            <div id="myBooksGrid" class="books-grid"></div>
        </section>

        <!-- Vista Publicar Libro -->
        <section id="view-publish" class="view-section" style="display: none;">
            <div class="auth-card" style="max-width:600px;">
                <h3>Nuevo Libro</h3>
                <form id="publishForm">
                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required>
                    </div>
                    <div class="form-group">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" required>
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <input type="text" id="descripcion">
                    </div>
                    <div class="form-group">
                        <label for="precio">Precio (USD)</label>
                        <input type="number" id="precio" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Categorías <span style="color:var(--text-muted); font-size:0.85rem;">(selecciona una o más)</span></label>
                        <div id="categoriesContainer" style="display:flex; flex-wrap:wrap; gap:0.6rem; padding:0.75rem; background:var(--surface-light); border-radius:8px; max-height:160px; overflow-y:auto; border:1px solid rgba(255,255,255,0.05);">
                            <span style="color:var(--text-muted); font-size:0.85rem;">Cargando categorías...</span>
                        </div>
                        <div id="noCategoryError" style="display:none; color:var(--danger); font-size:0.85rem; margin-top:0.25rem;">Selecciona al menos una categoría.</div>
                    </div>
                    <div class="form-group">
                        <label for="urlPortada">URL de Portada (Imagen)</label>
                        <input type="text" id="urlPortada" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="filePath">URL del PDF (Para descargas)</label>
                        <input type="text" id="filePath" placeholder="https://..." required>
                    </div>
                    <div id="publishError" class="error-message"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Publicar Libro</button>
                </form>
            </div>
        </section>

        <!-- Vista Mis Ventas -->
        <section id="view-sales" class="view-section" style="display: none;">
            <div id="salesList"></div>
        </section>

        <!-- Vista Perfil -->
        <section id="view-profile" class="view-section" style="display: none;">
            <div class="auth-card" style="max-width: 600px;">
                <h3>Actualizar Perfil de Vendedor</h3>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profName">Nombre Comercial / Completo</label>
                        <input type="text" id="profName" required>
                    </div>
                    <div class="form-group">
                        <label for="profPhone">Teléfono de Contacto</label>
                        <input type="text" id="profPhone">
                    </div>
                    <div class="form-group">
                        <label for="profAddress">Dirección de Facturación</label>
                        <input type="text" id="profAddress">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Guardar Cambios</button>
                    <div id="profileMessage" style="margin-top: 1rem; color: var(--primary);"></div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = api.auth.getCurrentUser();
            if (!user || user.role !== 'SELLER') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userInfo').textContent = `Hola, ${user.fullName}`;
            document.getElementById('autor').value = user.fullName;

            // Navegación
            const views = ['mybooks', 'publish', 'sales', 'profile'];
            views.forEach(v => {
                document.getElementById(`nav-${v}`).addEventListener('click', (e) => {
                    e.preventDefault();
                    views.forEach(view => {
                        document.getElementById(`view-${view}`).style.display = 'none';
                        document.getElementById(`nav-${view}`).classList.remove('active');
                    });
                    document.getElementById(`view-${v}`).style.display = 'block';
                    document.getElementById(`nav-${v}`).classList.add('active');

                    if (v === 'mybooks') { document.getElementById('viewTitle').textContent = 'Mis Libros'; loadMyBooks(); }
                    if (v === 'publish') { 
                        document.getElementById('viewTitle').textContent = 'Publicar Libro';
                        loadCategoriesForSelect();
                    }
                    if (v === 'sales') { document.getElementById('viewTitle').textContent = 'Mis Ventas'; loadSales(); }
                    if (v === 'profile') { document.getElementById('viewTitle').textContent = 'Mi Perfil'; loadProfile(); }
                });
            });

            async function loadCategoriesForSelect() {
                const container = document.getElementById('categoriesContainer');
                try {
                    const categories = await api.get('/books/categories');
                    if (!categories || categories.length === 0) {
                        container.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">No hay categorías creadas aún. El admin debe crearlas primero.</span>';
                        return;
                    }
                    container.innerHTML = '';
                    categories.forEach(c => {
                        const id = `cat_${c.replace(/\s+/g, '_')}`;
                        const label = document.createElement('label');
                        label.htmlFor = id;
                        label.style.cssText = 'display:flex; align-items:center; gap:0.4rem; background:var(--surface); padding:0.4rem 0.75rem; border-radius:20px; cursor:pointer; font-size:0.9rem; border:1px solid rgba(255,255,255,0.08); transition:all 0.2s;';
                        label.innerHTML = `<input type="checkbox" id="${id}" value="${c}" style="accent-color:var(--primary); width:15px; height:15px;"> ${c}`;
                        label.querySelector('input').addEventListener('change', (e) => {
                            if (e.target.checked) {
                                label.style.background = 'var(--primary)';
                                label.style.color = '#fff';
                                label.style.borderColor = 'var(--primary)';
                            } else {
                                label.style.background = 'var(--surface)';
                                label.style.color = '';
                                label.style.borderColor = 'rgba(255,255,255,0.08)';
                            }
                        });
                        container.appendChild(label);
                    });
                } catch (e) {
                    container.innerHTML = '<span style="color:var(--danger);">Error cargando categorías.</span>';
                    console.error('Error loading categories', e);
                }
            }

            loadMyBooks();

            // Actualizar Perfil
            const profileForm = document.getElementById('profileForm');
            if (profileForm) {
                profileForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const msgDiv = document.getElementById('profileMessage');
                    try {
                        const res = await api.put(`/users/${user.id}/profile`, {
                            fullName: document.getElementById('profName').value,
                            phone: document.getElementById('profPhone').value,
                            address: document.getElementById('profAddress').value
                        });
                        msgDiv.textContent = 'Perfil actualizado con éxito.';
                        msgDiv.style.color = 'var(--primary)';
                        document.getElementById('userInfo').textContent = `Hola, ${res.fullName}`;
                    } catch (error) {
                        msgDiv.textContent = error.message;
                        msgDiv.style.color = 'var(--danger)';
                    }
                });
            }

            // Publicar libro
            document.getElementById('publishForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errDiv = document.getElementById('publishError');
                const noCatErr = document.getElementById('noCategoryError');

                // Recopilar categorías marcadas
                const checkedBoxes = document.querySelectorAll('#categoriesContainer input[type="checkbox"]:checked');
                const selectedCategories = Array.from(checkedBoxes).map(cb => cb.value);

                if (selectedCategories.length === 0) {
                    noCatErr.style.display = 'block';
                    return;
                }
                noCatErr.style.display = 'none';

                try {
                    errDiv.style.display = 'none';
                    await api.post('/books', {
                        title: document.getElementById('titulo').value,
                        author: document.getElementById('autor').value,
                        description: document.getElementById('descripcion').value,
                        price: parseFloat(document.getElementById('precio').value),
                        categories: selectedCategories,
                        coverUrl: document.getElementById('urlPortada').value,
                        filePath: document.getElementById('filePath').value,
                        sellerEmail: user.email,
                        status: 'PENDIENTE'
                    });
                    alert('¡Libro enviado para revisión!');
                    document.getElementById('publishForm').reset();
                    // Reset checkbox visuals
                    document.querySelectorAll('#categoriesContainer label').forEach(lbl => {
                        lbl.style.background = 'var(--surface)';
                        lbl.style.color = '';
                        lbl.style.borderColor = 'rgba(255,255,255,0.08)';
                    });
                    document.getElementById('autor').value = user.fullName;
                    document.getElementById('nav-mybooks').click();
                } catch (error) {
                    errDiv.textContent = error.message;
                    errDiv.style.display = 'block';
                }
            });
        });

        async function loadMyBooks() {
            const user = api.auth.getCurrentUser();
            const grid = document.getElementById('myBooksGrid');
            try {
                grid.innerHTML = '<p>Cargando...</p>';
                const books = await api.get(`/books/seller/${user.email}`);
                if (!books || books.length === 0) { grid.innerHTML = '<p>No tienes libros publicados aún.</p>'; return; }
                grid.innerHTML = '';
                books.forEach(book => {
                    const statusColor = book.status === 'APROBADO' ? 'var(--primary)' : book.status === 'RECHAZADO' ? 'var(--danger)' : '#f0ad4e';
                    const categories = book.categories && book.categories.length > 0 ? book.categories : [];
                    const tagsHtml = categories.map(c => `<span style="display:inline-block; background:rgba(0,212,255,0.12); color:var(--primary); font-size:0.72rem; padding:0.2rem 0.55rem; border-radius:20px; border:1px solid rgba(0,212,255,0.25);">${c}</span>`).join(' ');
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div style="background:var(--surface-light); height:180px; display:flex; align-items:center; justify-content:center;">
                            ${book.coverUrl ? `<img src="${book.coverUrl}" style="height:100%; object-fit:cover; width:100%;" onerror="this.outerHTML='<span style=font-size:3rem>📚</span>'">` : '<span style="font-size:3rem">📚</span>'}
                        </div>
                        <div class="book-info">
                            <h3 class="book-title">${book.title}</h3>
                            <p class="book-author">$${book.price.toFixed(2)}</p>
                            ${tagsHtml ? `<div style="display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.4rem;">${tagsHtml}</div>` : ''}
                            <span style="color:${statusColor}; font-weight:bold; font-size:0.85rem; text-transform:uppercase;">● ${book.status}</span>
                            <button class="btn btn-danger mt-1" style="font-size:0.8rem;" onclick="deleteBook('${book.id}')">Eliminar</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) { grid.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }

        async function deleteBook(bookId) {
            if (!confirm('¿Estás seguro de eliminar este libro?')) return;
            try { await api.delete(`/books/${bookId}`); loadMyBooks(); } catch (e) { alert(e.message); }
        }

        async function loadProfile() {
            const user = api.auth.getCurrentUser();
            if (!user) return;
            try {
                const profile = await api.get(`/users/${user.id}/profile`);
                document.getElementById('profName').value = profile.fullName || '';
                document.getElementById('profPhone').value = profile.phone || '';
                document.getElementById('profAddress').value = profile.address || '';
            } catch (error) {
                console.error('Error cargando perfil:', error);
            }
        }

        async function loadSales() {
            const user = api.auth.getCurrentUser();
            const container = document.getElementById('salesList');
            try {
                container.innerHTML = '<p>Cargando ventas...</p>';
                const orders = await api.get(`/orders/seller/${user.email}`);
                if (!orders || orders.length === 0) { container.innerHTML = '<p>Aún no tienes ventas registradas.</p>'; return; }
                let total = 0;
                let html = '<div style="display:flex; flex-direction:column; gap:1rem;">';
                orders.forEach(order => {
                    total += order.totalPrice || 0;
                    const bookTitle = order.book ? order.book.title : 'Libro';
                    const fecha = order.orderedAt ? new Date(order.orderedAt).toLocaleDateString() : '';
                    html += `
                        <div style="background:var(--surface); padding:1rem; border-radius:8px; border:1px solid var(--surface-light);">
                            <div class="flex space-between" style="align-items:center;">
                                <div>
                                    <strong>${bookTitle}</strong>
                                    <span style="color:var(--text-muted); margin-left:1rem;">${fecha}</span>
                                </div>
                                <span style="color:var(--primary); font-weight:bold;">$${(order.totalPrice || 0).toFixed(2)}</span>
                            </div>
                        </div>`;
                });
                html += `</div>
                    <div style="text-align:right; margin-top:2rem; font-size:1.3rem;">
                        Total Ventas: <span style="color:var(--primary); font-weight:bold;">$${total.toFixed(2)}</span>
                    </div>`;
                container.innerHTML = html;
            } catch (error) { container.innerHTML = `<p class="error-message" style="display:block">${error.message}</p>`; }
        }
    </script>
</body>
</html>
