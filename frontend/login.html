<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OpenLib Market</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">OpenLib <span>Market</span></a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="text-center">Bienvenido de nuevo</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <div id="loginError" class="error-message"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Ingresar</button>
            </form>
            <p class="text-center mt-1" style="color: var(--text-muted); font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="register.html" style="color: var(--primary);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
